<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Dom</title>
    <style>
        .main{
            width: 300px;
            height: 300px;
            background-color: aqua;
        }
        .red{
            background-color: red;
        }
        .blue{
            background-color: blue;
        }
        .green{
            background-color: green;
        }
        .dark{
            background-color: black;
            color: white;
        }
        
    </style>
   
</head>
<body id="body">
    <button onclick="themeChanger()">Change Theme</button>
    <div id="div" class="main para">
       <button onclick="fun()">Red</button>
       <button onclick="fun1()">Blue</button>
       <button onclick="fun2()">Green</button>

    </div>
  <script>
  let element = document.getElementById("body")
  function themeChanger(){
    element.classList.toggle("dark");
  }
  console.log(element.classList);
    let ele = document.getElementById("div")
    
   function fun(){
    ele.classList.remove("blue","green")
    ele.classList.add("red")
   }
   function fun1(){
    ele.classList.remove("red","green")

    ele.classList.add("blue")
   }
   function fun2(){
    ele.classList.remove("blue","red")
    ele.classList.add("green")
   }
  </script>
</body>
</html>
