<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-decoration: solid 3px underline overline;
        }
        h1:hover{
            color: blue;
            background-color: red;
        }
        a:link{
            color: black;
        }
        a:visited{
            color: red;
        }
        a:hover{
            color: blue;
            text-decoration: none;
        }
        input:focus{
            background-color: aqua;
        }
        p:first-child{
            background-color: red;
        }
        p:first-of-type{
            background-color: blue;
        }
        p:last-child{
            background-color: blueviolet;
        }
        p:last-of-type{
            background-color: aqua;
        }
        p:nth-child(3n+1){
            background-color: pink;
        }
    </style>
</head>
<body>
    <p>First tag in body p</p>
    <h1>Adfar RAsheed</h1>
    <a href="http://www.flipkart.com">Flipkart</a>
    <input type="text">
    <div class="main">
        <p>text1 p tag</p>
        <p>text2 p tag</p>
        <p>text3 p tag</p>
        <p>text4 p tag</p>
        <p>text5 p tag</p>
        <p>text6 p tag</p>
        <p>text7 p tag</p>
        <p>text8 p tag</p>
        <p>text9 p tag</p>
        <p>text10 p tag</p>
        <p>text11 p tag</p>
        <p>text12 p tag</p>
        <p>text13 p tag</p>
    </div>
    
</body>
</html>
