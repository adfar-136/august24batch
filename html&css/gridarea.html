<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            background-color: aqua;
            width: 50%;
            height: 50%;
            display: grid;
            grid-template-areas: "..... header header"
                                 "sidebar content content"
                                 "main main navbar"
                                 "footer footer footer";
            gap: 10px;
        }
        .item{
            background-color: cadetblue;
            height: 100px;
        }
        .item1{
            grid-area: header;
        }
        .item2{
            grid-area: sidebar ;
        }
        .item3{
            grid-area: content;
        }
        .item4{
            grid-area: main;
        }
        .item5{
            grid-area: navbar;
        }
        .item6{
            grid-area: footer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">Header</div>
        <div class="item item2">SideBAr</div>
        <div class="item item3">Content</div>
        <div class="item item4">main</div>
        <div class="item item5">navbar</div>
        <div class="item item6">footer</div>
    </div>
</body>
</html>
